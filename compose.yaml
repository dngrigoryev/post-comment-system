x-app: &app
  image: client-services:local
  build:
    context: .
    target: runtime
  init: true
  environment: &app-env
    HTTP_ADDR: ":8080"
    AUTH_USERS: ${AUTH_USERS:?Copy .env.example to .env and configure AUTH_USERS}

services:
  app-memory:
    <<: *app
    profiles: [memory]
    environment:
      <<: *app-env
      STORAGE: memory
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"

  app-postgres:
    <<: *app
    profiles: [postgres]
    environment:
      <<: *app-env
      STORAGE: postgres
      DATABASE_URL: postgres://client_services:${POSTGRES_PASSWORD:-development-password}@db:5432/client_services?sslmode=disable
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    <<: *app
    profiles: [postgres]
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://client_services:${POSTGRES_PASSWORD:-development-password}@db:5432/client_services?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    profiles: [postgres]
    environment:
      POSTGRES_DB: client_services
      POSTGRES_USER: client_services
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U client_services -d client_services"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
