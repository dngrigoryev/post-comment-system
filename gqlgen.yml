schema:
  - internal/transport/graphql/schema.graphqls

exec:
  package: generated
  layout: single-file
  filename: internal/transport/graphql/generated/generated.go

model:
  package: model
  filename: internal/transport/graphql/model/models_gen.go

resolver:
  package: resolver
  layout: follow-schema
  dir: internal/transport/graphql/resolver
  filename_template: "{name}.resolvers.go"

models:
  Post:
    extraFields:
      AuthorID:
        type: int64
        overrideTags: 'json:"-"'
    fields:
      author:
        resolver: true
      comments:
        resolver: true
  Comment:
    extraFields:
      PostID:
        type: int64
        overrideTags: 'json:"-"'
      AuthorID:
        type: int64
        overrideTags: 'json:"-"'
    fields:
      author:
        resolver: true
      replies:
        resolver: true
